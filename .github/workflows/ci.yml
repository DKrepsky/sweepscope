name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a full commit SHA (the version is in the comment), as in the driver repository.
# Linux is the supported platform, so everything runs on Ubuntu. Job names are the required checks of `main`.
jobs:
  rust:
    name: Rust (all crates except the shell)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --exclude sweepscope-app --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude sweepscope-app --all-targets --locked

      - name: Check that the generated API types are up to date
        run: test -z "$(git status --porcelain -- frontend/src/api/generated)"

      - name: Check licences, bans and sources
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3

      - name: Install cargo-audit
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit

      - name: Audit advisories
        run: cargo audit

  shell:
    name: Shell (src-tauri)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install WebKitGTK development packages
        run: >
          sudo apt-get update && sudo apt-get install -y
          build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev
          libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend (the shell embeds frontend/dist at compile time)
        run: npm --prefix frontend ci && npm --prefix frontend run build

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Lint
        run: cargo clippy -p sweepscope-app --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test -p sweepscope-app --all-targets --locked

      - name: Check that the generated API types and command manifest are up to date
        run: test -z "$(git status --porcelain -- frontend/src/api/generated)"

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm --prefix frontend ci

      - name: ESLint
        run: npm --prefix frontend run lint

      - name: Stylelint
        run: npm --prefix frontend run lint:css

      - name: Prettier
        run: npm --prefix frontend run format:check

      - name: Type check (svelte-check)
        run: npm --prefix frontend run typecheck

      - name: Test
        run: npm --prefix frontend run test

      - name: Check that the generated tokens are up to date
        run: node frontend/tools/gen-tokens.mjs && test -z "$(git status --porcelain -- frontend/src/design-system)"

      - name: Audit dependencies
        run: npm --prefix frontend audit --audit-level=high

  architecture:
    name: Architecture and repository checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Test the checks
        run: node --test "tools/*.test.mjs"

      - name: Check crate dependency rules
        run: node tools/check-architecture.mjs

      - name: Check test names
        run: node tools/check-test-names.mjs

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Lint workflows
        run: actionlint

      - name: Audit root dependencies
        run: npm ci && npm audit --audit-level=high

  browser:
    name: Browser tests (Chromium and WebKit)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm --prefix frontend ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      # Runs on every run, also on a cache hit: the system libraries (--with-deps) are not part of the cache.
      - name: Install browsers
        run: npm --prefix frontend exec -- playwright install --with-deps chromium webkit

      - name: Run Playwright
        run: npm --prefix frontend exec -- playwright test --project=chromium e2e/visual.spec.ts --update-snapshots all --retries=0

      - name: Upload regenerated snapshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshots
          path: frontend/e2e/__screenshots__/chromium/visual.spec.ts/

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  bundle:
    name: Bundle (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install WebKitGTK development packages
        run: >
          sudo apt-get update && sudo apt-get install -y
          build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev
          libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install
        run: npm ci && npm --prefix frontend ci

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build the .deb and AppImage bundles
        run: npm run build -- --bundles deb,appimage

      - name: Keep the bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundles
          path: target/release/bundle/
          retention-days: 7
