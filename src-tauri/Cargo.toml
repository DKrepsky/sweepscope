[package]
name = "sweepscope-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "SweepScope desktop shell: composition root and IPC"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
sweepscope-acquisition = { path = "../backend/features/acquisition" }
sweepscope-calibration = { path = "../backend/features/calibration" }
sweepscope-device = { path = "../backend/features/device" }
sweepscope-display = { path = "../backend/features/display" }
sweepscope-export = { path = "../backend/features/export" }
sweepscope-kernel = { path = "../backend/kernel" }
sweepscope-measurement = { path = "../backend/features/measurement" }
sweepscope-recording = { path = "../backend/features/recording" }
sweepscope-settings = { path = "../backend/features/settings" }
sweepscope-spectrum = { path = "../backend/features/spectrum" }
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
