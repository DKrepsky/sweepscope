[package]
name = "sweepscope-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "SweepScope desktop shell: composition root and IPC"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
sweepscope-acquisition = { path = "../backend/features/acquisition" }
sweepscope-device = { path = "../backend/features/device" }
sweepscope-display = { path = "../backend/features/display" }
sweepscope-kernel = { path = "../backend/kernel" }
sweepscope-settings = { path = "../backend/features/settings" }
env_logger = "0.11"
log = "0.4"
serde_json = "1"
tauri = { version = "2.12", features = [] }
