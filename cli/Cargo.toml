[package]
name = "sweepscope-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "SweepScope headless capture: a second composition root without Tauri (ADR 0022)"

[lints]
workspace = true

[lib]
name = "sweepscope_cli"
path = "src/lib.rs"

[[bin]]
name = "sweepscope-cli"
path = "src/main.rs"

[dependencies]
sweepscope-acquisition = { path = "../backend/features/acquisition" }
sweepscope-calibration = { path = "../backend/features/calibration" }
sweepscope-device = { path = "../backend/features/device" }
sweepscope-export = { path = "../backend/features/export" }
sweepscope-kernel = { path = "../backend/kernel" }

[dev-dependencies]
serde_json = "1"
